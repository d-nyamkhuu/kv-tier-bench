# Inputs to the static cost table. Read from docs.nebius.com on 2026-11-15; re-check before publishing.
# Readers can swap in their own prices and rerun `kvtb cost`.

gpu_hour_usd:
  rtx-pro-6000: 1.80        # gpu-rtx6000, on demand, per GPU (vCPU/RAM included). Stage 1 runs preemptible in
                            # us-central1: spot $0.79-1.79, 30-day median $0.94 (api.nebius.cloud, 2026-11-16).
                            # The table uses on demand, the price a reader can count on.

# "included" = already paid for with the GPU VM (HBM, host RAM). null = price not known yet; `kvtb cost` refuses
# to use it rather than treat it as free.
storage_gib_month_usd:
  gpu: included
  cpu: included
  p2p: included             # peer CPU memory, as for cpu
  fs_network_ssd_nrd: 0.053 # network_ssd_non_replicated
  obj_enhanced: 0.11        # Object Storage, Enhanced Throughput class; its requests and same-region traffic are free
