# The sweep. `kvtb run` expands it into points; `kvtb serve-cmd` turns one (stage, model, deployment) into a `docker run`.
# Decisions behind every value: docs/plan.md.

models:
  qwen3.8-27b:
    hf_id: Qwen/Qwen3.8-27B          # hybrid: 16 full-attention + 48 Gated DeltaNet layers
    config: configs/models/qwen3.8-27b.config.json
    params: 27781427952              # HF safetensors total (incl. vision tower), 2026-11-15
    extra_args:
      - --mamba-ssm-cache-dtype=bfloat16          # user decision; HF default is float32
      - --no-disable-hybrid-kv-cache-manager      # the offloading connector must not turn HMA off
  qwen3-vl-32b:
    hf_id: Qwen/Qwen3-VL-32B-Instruct  # standard: 64 full-attention layers
    config: configs/models/qwen3-vl-32b-instruct.config.json
    params: 33360000000              # approx., from the HF model page
    extra_args: []

common_args:
  - --enable-prefix-caching
  - --dtype=bfloat16
  - --kv-cache-dtype=auto
  - --limit-mm-per-prompt={"image":0,"video":0}   # text-only
  - --max-num-seqs=32

tiers: [recompute, gpu, cpu, fs, obj, p2p]

# Target prefix lengths in tokens. The driver rounds each down to a multiple of the deployment's block size,
# which it reads from the engine at run time (the hybrid model uses large blocks).
prefix_tokens: [1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072]
reps: 5
recompute_reps: 1        # recompute is a full second prefill; each job's cold write (`write_s`) is the second sample

stages:
  s1:
    description: 2 x RTX PRO 6000 (1 GPU each, gpu-rtx6000-a), Nebius eu-south1, TCP between VMs
    gpu: rtx-pro-6000               # key into configs/prices.yaml
    disk_price: fs_network_ssd_nrd  # key into configs/prices.yaml
    tp: 1
    gpus_per_instance: 1
    # largest prefix is 16 GiB (vl-32b at 64K); kept well under half of the 218 GiB RAM, because at TP=1 the p2p
    # tier pins it a second time (NIXL/UCX cuMemHostRegister) and 120 GiB failed with "out of memory"
    cpu_tier_gib: 48
    # NIXL settings vLLM v0.34.0 does not expose, applied by scripts/nixl_patch (p2p only). Stock vLLM sends a whole
    # pull over 1 TCP stream (~1.5 GiB/s at 16K); this splits it over 16 (~2.8 GiB/s at 128K, capped by one receive
    # thread on the consumer). docs/plan.md, day-1 checks.
    p2p_nixl:
      num_threads: 16         # NIXL UCX workers, each with its own TCP connection to the peer
      split_batch_size: 16    # split a transfer across the workers from 16 descriptors (NIXL default 1024)
      skip_desc_merge: true   # else NIXL merges a prefix's contiguous blocks into ~1 descriptor and never splits
    # The image's CUDA 13 NIXL build has an OBJ plugin that links libcuobjclient.so.1, which the image lacks, so the
    # obj tier fails at startup (NIXL_ERR_NOT_FOUND). scripts/nixl_patch makes the obj deployment load the image's
    # CUDA 12 NIXL build instead, whose OBJ plugin has no such dependency. The obj tier moves host memory only.
    # That build's AWS SDK reads CA certs from /etc/pki/tls/certs/ca-bundle.crt, so launch.py mounts the host's there.
    obj_nixl_cuda_major: 12
    tiers: [recompute, gpu, cpu, fs, obj, p2p]
    max_prefix_tokens:
      qwen3-vl-32b: 65536           # 128K needs ~32 GiB of KV; ~25 GB is free on a 96 GB card
    gpu_mem_gib: 95                 # RTX PRO 6000 Blackwell, as reported by nvidia-smi (~97,887 MiB)
    gpu_memory_utilization: 0.95
    # vLLM refuses to start if one max-length sequence does not fit in GPU KV memory
    max_model_len:
      default: 140000
      qwen3-vl-32b: 66000           # 64K prefix + headroom; ~16 GiB of KV
    s3_endpoint: storage.eu-south1.nebius.cloud   # endpoint template from Nebius docs; check on day 1
    s3_region: eu-south1
    disk_mount: /mnt/kv

s3_bucket: kvtb-cache   # Enhanced Throughput class
validity_prompts: 5     # per (model, tier); natural text, greedy output compared with recompute
max_attempts: 3         # a point is done when valid, or after this many invalid attempts (each with a fresh prompt)
