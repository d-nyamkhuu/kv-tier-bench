<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560">
<rect width="980" height="560" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="36" y="34" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">End-to-End KV Transfer Path Bandwidths (PCIe Hosts → NVL72 Racks → Vera Rubin)</text>
<text x="36" y="55" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569">Effective unidirectional KV transfer bandwidth per GPU/node is governed by the narrowest hop: BW_path = min_e(BW_e)</text>
<rect x="28" y="75" width="924" height="43" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<text x="38" y="91" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Path 1: Vera Rubin NVL72 (NVLink 6)</text>
<text x="38" y="106" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="9.2" fill="#64748b">Rubin HBM4 → NVSwitch 6 → Any of 72 Rack GPUs (260 TB/s rack)</text>
<rect x="375" y="83" width="443.1" height="22" rx="4" fill="#047857" fill-opacity="0.88"/>
<text x="827.1" y="98" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" fill="#0f172a">1,640.0 GB/s (t_0≈0.55 µs)</text>
<rect x="28" y="126" width="924" height="43" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<text x="38" y="142" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Path 2: 8×ConnectX-9 1.6Tb/s Rail-Opt</text>
<text x="38" y="157" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="9.2" fill="#64748b">8×Rubin GPU → PCIe6 → 8×CX-9 1.6T → Quantum-X800 / Spectrum-X</text>
<rect x="375" y="134" width="436.7" height="22" rx="4" fill="#059669" fill-opacity="0.88"/>
<text x="820.7" y="149" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" fill="#0f172a">1,472.0 GB/s (t_0≈0.85 µs)</text>
<rect x="28" y="177" width="924" height="43" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<text x="38" y="193" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Path 3: GB200 / GB300 NVL72 (NVLink 5)</text>
<text x="38" y="208" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="9.2" fill="#64748b">Blackwell HBM3e → NVSwitch 5 → Any of 72 Rack GPUs (130 TB/s rack)</text>
<rect x="375" y="185" width="401.6" height="22" rx="4" fill="#10b981" fill-opacity="0.88"/>
<text x="785.6" y="200" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" fill="#0f172a">820.0 GB/s (t_0≈0.65 µs)</text>
<rect x="28" y="228" width="924" height="43" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<text x="38" y="244" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Path 4: Vera-Rubin NVLink-C2C Gen2</text>
<text x="38" y="259" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="9.2" fill="#64748b">Vera CPU LPDDR5X (1.5 TB) ↔ Rubin HBM4 (Coherent 1.8 TB/s bidir)</text>
<rect x="375" y="236" width="401.6" height="22" rx="4" fill="#0284c7" fill-opacity="0.88"/>
<text x="785.6" y="251" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" fill="#0f172a">820.0 GB/s (t_0≈0.35 µs)</text>
<rect x="28" y="279" width="924" height="43" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<text x="38" y="295" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Path 5: 8×NDR 400G GPUDirect RDMA</text>
<text x="38" y="310" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="9.2" fill="#64748b">8×H100 → PCIe5 Sw → 8×CX-7 400G → Leaf Sw → Remote 8×H100</text>
<rect x="375" y="287" width="353.7" height="22" rx="4" fill="#2563eb" fill-opacity="0.88"/>
<text x="737.7" y="302" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" fill="#0f172a">368.0 GB/s (t_0≈1.1 µs)</text>
<rect x="28" y="330" width="924" height="43" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<text x="38" y="346" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Path 6: BlueField-4 ICMS Context Pod</text>
<text x="38" y="361" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="9.2" fill="#64748b">BF-4 DPU (1.6Tb/s) → RDMA Pre-Stage from Pod G3.5 Flash Pool</text>
<rect x="375" y="338" width="309.2" height="22" rx="4" fill="#d97706" fill-opacity="0.88"/>
<text x="693.2" y="353" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" fill="#0f172a">175.0 GB/s (t_0≈8.0 µs)</text>
<rect x="28" y="381" width="924" height="43" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<text x="38" y="397" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Path 7: 1×PCIe Gen6 / Gen5 Pinned Host</text>
<text x="38" y="412" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="9.2" fill="#64748b">Host DDR5 → Root Complex → PCIe6 (110 GB/s) or PCIe5 (55 GB/s)</text>
<rect x="375" y="389" width="281.4" height="22" rx="4" fill="#6366f1" fill-opacity="0.88"/>
<text x="665.4" y="404" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" fill="#0f172a">110.0 GB/s (t_0≈1.1 µs)</text>
<rect x="28" y="432" width="924" height="43" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<text x="38" y="448" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Path 8: 1×NDR 400G Shared Cloud NIC</text>
<text x="38" y="463" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="9.2" fill="#64748b">8 GPUs Bottlenecked on Single Front-End 400G RDMA NIC</text>
<rect x="375" y="440" width="229.2" height="22" rx="4" fill="#ea580c" fill-opacity="0.88"/>
<text x="613.2" y="455" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" fill="#0f172a">46.0 GB/s (t_0≈1.2 µs)</text>
<rect x="28" y="483" width="924" height="43" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<text x="38" y="499" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Path 9: Host-Bounce TCP / Non-GDR</text>
<text x="38" y="514" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="9.2" fill="#64748b">NIC → Host DRAM (NUMA Cross) → CPU Copy → PCIe → GPU HBM</text>
<rect x="375" y="491" width="167.8" height="22" rx="4" fill="#dc2626" fill-opacity="0.88"/>
<text x="551.8" y="506" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" fill="#0f172a">16.5 GB/s (t_0≈25 µs)</text>
</svg>