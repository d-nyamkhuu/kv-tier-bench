[project]
name = "kv-tier-bench"
version = "0.1.0"
description = "Measured store/load profile of every vLLM KV-cache tier (GPU, CPU, disk, object store, p2p) vs recompute, hybrid vs standard attention."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Nyamkhuu Demberelsuren", email = "nyamhyy14@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "pyyaml==6.0.3",
]

[project.scripts]
kvtb = "kv_tier_bench.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "matplotlib==3.11.2",  # `kvtb charts` runs locally only, so the driver image (--no-dev) leaves it out
    "pytest==9.2.0",
    "ruff==0.17.5",
]
